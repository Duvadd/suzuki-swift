<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suzuki Swift 1.3 (2000) - Gyári, Tuning & Terepjáró</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1a1a24;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    #app {
      max-width: 800px;
      width: 100%;
      background: #252636;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 { color: #ff4757; text-align: center; margin-bottom: 5px; }
    h2 { color: #2ed573; text-align: center; margin-top: 30px; }
    .subtitle { text-align: center; color: #a4b0be; margin-bottom: 20px; }
    .img-container { text-align: center; margin: 20px 0; }
    .img-container img {
      width: 100%;
      max-width: 600px;
      border-radius: 8px;
      border: 3px solid #ff4757;
    }
    .img-container.offroad img {
      border-color: #2ed573;
    }
    .cards { display: flex; gap: 15px; margin-top: 20px; flex-wrap: wrap; }
    .card {
      flex: 1;
      min-width: 220px;
      background: #2f3542;
      padding: 15px;
      border-radius: 8px;
    }
    .card h3 { margin-top: 0; color: #eccc68; }
    .card.tuning h3 { color: #70a1ff; }
    .card.offroad h3 { color: #2ed573; }
    ul { padding-left: 20px; margin: 0; }
    li { margin-bottom: 8px; color: #dcdde1; }
    .interactive-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
    }
    .interactive-btn:hover { background: #ff6b81; }
    #sound-status { text-align: center; margin-top: 10px; color: #2ed573; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Csak egyetlen gyökér elem van a HTML-ben, a többit a JS hozza létre -->
  <div id="app"></div>

  <script>
    // Várjuk meg, amíg a DOM betöltődik
    document.addEventListener("DOMContentLoaded", function() {
      const app = document.getElementById("app");

      // 1. Cím és Alcím
      const title = document.createElement("h1");
      title.innerText = "🚗 Suzuki Swift 1.3 (2000)";
      
      const subtitle = document.createElement("p");
      subtitle.className = "subtitle";
      subtitle.innerText = "A legenda: Gyári állapot, Utcai Tuning és az Exkluzív Terepjáró Edition";

      // 2. Első kép beszúrása (Tuning)
      const imgDiv1 = document.createElement("div");
      imgDiv1.className = "img-container";
      const img1 = document.createElement("img");
      img1.src = "swift.tune.jpg";
      img1.alt = "Tuningolt Suzuki Swift 2000";
      imgDiv1.appendChild(img1);

      // 3. Kártyák konténere
      const cardsDiv = document.createElement("div");
      cardsDiv.className = "cards";

      // 3/A. Gyári Kártya
      const stockCard = document.createElement("div");
      stockCard.className = "card";
      stockCard.innerHTML = `
        <h3>⚙️ Gyári 1.3L 16V</h3>
        <ul>
          <li><strong>Teljesítmény:</strong> 85 LE</li>
          <li><strong>Motor:</strong> 1298 cm³ G13BB</li>
          <li><strong>Gyártás:</strong> Esztergom, Magyarország</li>
          <li><strong>Súly:</strong> kb. 820 kg</li>
          <li><strong>Kipufogó:</strong> Gyári csendes rendszer</li>
        </ul>
      `;

      // 3/B. Tuning Kártya
      const tuningCard = document.createElement("div");
      tuningCard.className = "card tuning";
      tuningCard.innerHTML = `
        <h3>🔥 2000-es Évek Tuning</h3>
        <ul>
          <li><strong>Teljesítmény:</strong> ~100 LE (Direktszűrő + Chip)</li>
          <li><strong>Optika:</strong> CT02/Sport első lökhárító</li>
          <li><strong>Kipufogó:</strong> Sport gázgyorsítós dob</li>
          <li><strong>Futómű:</strong> Ültetett rugók + Alufelni</li>
          <li><strong>Világítás:</strong> Angel Eyes fényszórók</li>
        </ul>
      `;

      // 3/C. Terepjáró Kártya
      const offroadCard = document.createElement("div");
      offroadCard.className = "card offroad";
      offroadCard.innerHTML = `
        <h3>🌲 Extreme 4x4 Off-Road</h3>
        <ul>
          <li><strong>Teljesítmény:</strong> 150 LE (Turbósított motor)</li>
          <li><strong>Hajtás:</strong> Kapcsolható 4x4 összkerék</li>
          <li><strong>Futómű:</strong> +15 cm emelt terep futómű</li>
          <li><strong>Kerekek:</strong> Bütykös Mud-Terrain gumik</li>
          <li><strong>Extrák:</strong> Csörlő, Snorkel, Tetőcsomagtartó</li>
        </ul>
      `;

      cardsDiv.appendChild(stockCard);
      cardsDiv.appendChild(tuningCard);
      cardsDiv.appendChild(offroadCard);

      // 4. Második Kép (Terepjáró Swift) az infók után
      const offroadTitle = document.createElement("h2");
      offroadTitle.innerText = "🚜 Suzuki Swift Off-Road Monster";

      const imgDiv2 = document.createElement("div");
      imgDiv2.className = "img-container offroad";
      const img2 = document.createElement("img");
      
      // HA LELTÖLTÖTTED A KÉPET A MAPPÁDBA TEREP.SWIFT.JPG NÉVEN, ÍRD ÁT EZT A SORT:
      // img2.src = "terep.swift.jpg";
      img2.src = "terep.swift.jpg"; 
      img2.alt = "Terepjáró Suzuki Swift 4x4";
      imgDiv2.appendChild(img2);

      // 5. Interaktív Gomb (Motor Duda / Pörgetés effekt)
      const btn = document.createElement("button");
      btn.className = "interactive-btn";
      btn.innerText = "🔊 Gázadás & Duda kipróbálása!";
      
      const status = document.createElement("p");
      status.id = "sound-status";

      btn.onclick = function() {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(450, audioCtx.currentTime + 0.5);

        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start();
        osc.stop(audioCtx.currentTime + 0.5);

        status.innerText = "⚡ VROOOOM! STUTUTUTU A Swift 1.3 felpörgött!";
        setTimeout(() => { status.innerText = ""; }, 2000);
      };

      // 6. Minden elem hozzáadása a fő containerhez a kívánt sorrendben
      app.appendChild(title);
      app.appendChild(subtitle);
      app.appendChild(imgDiv1);
      app.appendChild(cardsDiv);
      app.appendChild(offroadTitle);
      app.appendChild(imgDiv2);
      app.appendChild(btn);
      app.appendChild(status);
    });
  </script>
</body>
</html>
